name: manter supabase ativo

on:
  schedule:
    - cron: '17 11 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: js/config.js
          sparse-checkout-cone-mode: false
      - name: ping
        run: |
          url=$(grep -oP "supabaseUrl: '\K[^']+" js/config.js)
          key=$(grep -oP "supabaseAnonKey: '\K[^']+" js/config.js)
          status=$(curl -s -o /dev/null -w '%{http_code}' "$url/rest/v1/ideas?select=id&limit=1" -H "apikey: $key")
          echo "supabase respondeu $status"
          test "$status" = "200"
