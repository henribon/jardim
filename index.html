<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>jardim</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a0a0a'/><circle cx='16' cy='16' r='5' fill='%23cfcfcf'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<section class="login" id="login" hidden>
  <form id="loginForm">
    <div class="brand">jardim <span>digital</span></div>
    <input type="email" name="email" placeholder="seu email" autocomplete="username" required>
    <input type="password" name="code" placeholder="código de acesso" autocomplete="current-password" required>
    <button class="btn primary" type="submit">entrar</button>
    <p id="loginError"></p>
  </form>
</section>
<section id="app" hidden>
  <div class="map" id="map"></div>
  <header class="topbar">
    <div class="brand">jardim <span>digital</span></div>
    <span class="pill" id="modeBadge" hidden>local</span>
    <button class="btn primary" id="addRoot">+ ideia</button>
    <button class="icon-btn" id="logout" hidden aria-label="Sair"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg></button>
  </header>
  <p class="empty-hint" id="empty" hidden>clique no centro ou em + ideia para plantar a primeira</p>
  <div class="zoom">
    <button class="icon-btn" id="zoomIn" aria-label="Aproximar">+</button>
    <button class="icon-btn" id="zoomOut" aria-label="Afastar">−</button>
    <button class="icon-btn" id="zoomFit" aria-label="Enquadrar">⤢</button>
  </div>
  <aside class="card" id="card"></aside>
</section>
<div class="toast" id="toast"></div>
</body>
</html>
